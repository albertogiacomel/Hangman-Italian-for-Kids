name: Verify Hangman-Italian-for-Kids
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run check:types
      - run: npm run build
      - run: npm run test:kit
      - run: npm run test:sponsorship
        env:
          BROWSER_BINARY: /usr/bin/google-chrome
      - name: Verify controls and gameplay in Chrome
        run: npm run test:kit:browser
        env:
          BROWSER_BINARY: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: game-kit-verification
          path: |
            artifacts/game-kit/*.json
            artifacts/game-kit/*.png
            artifacts/sponsorship/*.json
            artifacts/sponsorship/*.png
